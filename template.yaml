AWSTemplateFormatVersion: '2010-09-09'
Description: Serverless File Processing and Tracking System

Resources:
  FileBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  FileTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: fileId
          AttributeType: S
      KeySchema:
        - AttributeName: fileId
          KeyType: HASH

  FileHandlerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FileTrackingPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${FileBucket.Arn}/*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                Resource: !GetAtt FileTable.Arn

  FileHandler:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt FileHandlerRole.Arn
      Timeout: 15
      MemorySize: 128
      Environment:
        Variables:
          BUCKET_NAME: !Ref FileBucket
          TABLE_NAME: !Ref FileTable
      Code:
        ZipFile: |
          import json
          import os
          import uuid
          import base64
          import boto3
          from datetime import datetime, timezone

          s3 = boto3.client("s3")
          table = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])

          def response(status, body):
              return {
                  "statusCode": status,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps(body)
              }

          def handler(event, context):
              method = event.get("httpMethod", "")
              path = event.get("resource", "")

              if method == "POST" and path == "/files":
                  try:
                      data = json.loads(event.get("body") or "{}")
                      filename = os.path.basename(data["filename"])
                      content = data["content"]
                      if not filename or not isinstance(content, str):
                          return response(400, {"error": "filename and string content are required"})
                      file_id = str(uuid.uuid4())
                      key = file_id + "/" + filename
                      s3.put_object(
                          Bucket=os.environ["BUCKET_NAME"],
                          Key=key,
                          Body=content.encode("utf-8"),
                          ContentType="text/plain"
                      )
                      item = {
                          "fileId": file_id,
                          "filename": filename,
                          "s3Key": key,
                          "status": "PROCESSED",
                          "createdAt": datetime.now(timezone.utc).isoformat()
                      }
                      table.put_item(Item=item)
                      return response(201, item)
                  except (KeyError, TypeError, ValueError) as exc:
                      return response(400, {"error": str(exc)})

              if method == "GET" and path == "/status/{fileId}":
                  file_id = (event.get("pathParameters") or {}).get("fileId")
                  if not file_id:
                      return response(400, {"error": "fileId is required"})
                  result = table.get_item(Key={"fileId": file_id})
                  item = result.get("Item")
                  if not item:
                      return response(404, {"error": "file not found"})
                  return response(200, item)

              return response(404, {"error": "route not found"})

  FileApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: file-tracking-api
      Description: Upload text files and retrieve processing status
      EndpointConfiguration:
        Types:
          - REGIONAL

  FilesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref FileApi
      ParentId: !GetAtt FileApi.RootResourceId
      PathPart: files

  UploadMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref FileApi
      ResourceId: !Ref FilesResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FileHandler.Arn}/invocations

  StatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref FileApi
      ParentId: !GetAtt FileApi.RootResourceId
      PathPart: status

  FileIdResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref FileApi
      ParentId: !Ref StatusResource
      PathPart: '{fileId}'

  StatusMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref FileApi
      ResourceId: !Ref FileIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${FileHandler.Arn}/invocations

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UploadMethod
      - StatusMethod
    Properties:
      RestApiId: !Ref FileApi

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref FileApi
      DeploymentId: !Ref ApiDeployment
      StageName: prod

  ApiInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FileHandler
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${FileApi}/*/*/*

Outputs:
  UploadUrl:
    Description: POST a JSON body with filename and content
    Value: !Sub https://${FileApi}.execute-api.${AWS::Region}.amazonaws.com/prod/files
  StatusUrl:
    Description: Append the returned fileId to this URL
    Value: !Sub https://${FileApi}.execute-api.${AWS::Region}.amazonaws.com/prod/status/
  BucketName:
    Value: !Ref FileBucket
  DynamoDBTableName:
    Value: !Ref FileTable
  LambdaFunctionName:
    Value: !Ref FileHandler
